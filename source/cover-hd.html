* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { position: relative; background: #0a0d18; font-family: 'Inter', 'Inter Tight', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

/* aurora: soft slanted light bands, strongest on the right, fading out to the left */
.aurora { position: absolute; inset: -10%; filter: blur(22px); opacity: 1; }
.band { position: absolute; top: -20%; height: 150%; border-radius: 50%; }
.b1 { left: 44%; width: 120px; background: linear-gradient(180deg, rgba(110,100,190,0) 0%, rgba(130,120,215,.5) 50%, rgba(110,100,190,0) 100%); transform: rotate(18deg); }
.b2 { left: 60%; width: 90px; background: linear-gradient(180deg, rgba(170,140,235,0) 0%, rgba(190,165,240,.7) 50%, rgba(170,140,235,0) 100%); transform: rotate(18deg); }
.b3 { left: 72%; width: 150px; background: linear-gradient(180deg, rgba(190,120,170,0) 0%, rgba(214,160,200,.85) 45%, rgba(190,120,170,0) 100%); transform: rotate(18deg); }
.b4 { left: 84%; width: 110px; background: linear-gradient(180deg, rgba(220,130,180,0) 0%, rgba(232,150,195,.75) 50%, rgba(220,130,180,0) 100%); transform: rotate(18deg); }
.b5 { left: 95%; width: 170px; background: linear-gradient(180deg, rgba(160,50,100,0) 0%, rgba(175,60,110,.7) 50%, rgba(160,50,100,0) 100%); transform: rotate(18deg); }
.glow { position: absolute; right: -6%; top: -10%; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(closest-side, rgba(170,40,90,.35), rgba(170,40,90,0)); filter: blur(30px); }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,13,24,.25) 0%, rgba(10,13,24,.7) 42%, rgba(10,13,24,.15) 100%); }

.logo { position: absolute; left: 137px; top: 92px; width: 156px; height: auto; }
.eyebrow { position: absolute; left: 137px; top: 336px; display: flex; align-items: center; gap: 18px; font: 500 17px/1 'Consolas', 'Courier New', monospace; letter-spacing: .22em; color: #aab4ff; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 26px; height: 2px; background: #aab4ff; }
.headline { position: absolute; left: 137px; top: 384px; font: 700 96px/112px 'Inter Tight', 'Inter', sans-serif; letter-spacing: -3.2px; }
.headline .l2 { display: block; background: linear-gradient(90deg, #8ea3ff 0%, #c4a6ff 52%, #f4a8d2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { position: absolute; left: 137px; top: 672px; width: 920px; font: 400 31px/1.42 'Inter', sans-serif; color: #b8bdcc; }

.rule { position: absolute; left: 137px; right: 137px; top: 958px; height: 1px; background: rgba(255,255,255,.12); }
.foot { position: absolute; left: 137px; right: 137px; top: 982px; display: flex; justify-content: space-between; align-items: center; }
.foot .left { display: flex; align-items: center; gap: 22px; }
.foot .tag { font: 600 16px 'Consolas', 'Courier New', monospace; letter-spacing: .18em; color: #aab4ff; text-transform: uppercase; }
.foot .brief { font: 400 23px 'Inter', sans-serif; color: #b8bdcc; }
.foot .site { font: 400 23px 'Inter', sans-serif; color: #b8bdcc; }
</style></head>
