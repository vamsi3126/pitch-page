<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 155px; height: 562px; background: #090A0C; overflow: hidden; }
body { font-family: Inter, system-ui, sans-serif; color: #C9CCD3; -webkit-font-smoothing: antialiased; position: relative; }
.head { height: 50px; display: flex; align-items: center; gap: 7px; padding: 0 10px 0 11px; }
.logo { width: 22px; height: 22px; border-radius: 50%; background: #1A1C22; border: 1px solid #2A2D35; display: flex; align-items: center; justify-content: center; }
.logo svg { width: 15px; height: 15px; }
.brand { font-size: 12.5px; font-weight: 700; color: #EDEEF1; letter-spacing: -.2px; flex: 1; }
.collapse { width: 11px; height: 11px; }
nav { padding: 2px 6px 0; }
.it { height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: 9.6px; font-weight: 500; color: #D3D5DB; border-radius: 6px; white-space: nowrap; }
.it svg.ic { width: 11px; height: 11px; flex: none; }
.it .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.it svg.chev { width: 8px; height: 8px; flex: none; }
.sub { padding-left: 26px; font-weight: 500; }
.muted { color: #5B5F69; }
.lock { width: 8px; height: 9px; flex: none; }
.gap { height: 9px; }
.active { background: rgba(124, 92, 255, .22); color: #EEE9FF; box-shadow: inset 0 0 0 1px rgba(150, 125, 255, .28); }
.help { position: absolute; left: 6px; right: 6px; bottom: 12px; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="lock" viewBox="0 0 8 9"><rect x=".7" y="3.8" width="6.6" height="4.6" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.2 3.8 V2.6 a1.8 1.8 0 0 1 3.6 0 V3.8" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
    <symbol id="down" viewBox="0 0 8 8"><path d="M1.5 3 L4 5.5 L6.5 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="right" viewBox="0 0 8 8"><path d="M3 1.5 L5.5 4 L3 6.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<div class="head">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#C9CCD3" stroke-width="1.3"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.6" fill="#C9CCD3" stroke="none"/></svg></div>
  <div class="brand">Silicofeller</div>
  <svg class="collapse" viewBox="0 0 12 12" fill="none" stroke="#8B8F98" stroke-width="1"><rect x="1" y="1.5" width="10" height="9" rx="1.6"/><path d="M4.4 1.5 V10.5"/></svg>
</div>
<nav>
  <div class="it"><svg class="ic" viewBox="0 0 12 12" fill="none" stroke="#A3A7AF" stroke-width="1.1"><rect x="1" y="1" width="4" height="4" rx=".8"/><rect x="7" y="1" width="4" height="4" rx=".8"/><rect x="1" y="7" width="4" height="4" rx=".8"/><rect x="7" y="7" width="4" height="4" rx=".8"/></svg><span class="lbl">Dashboard</span></div>
  <div class="it"><svg class="ic" viewBox="0 0 12 12" fill="none" stroke="#A3A7AF" stroke-width="1.1"><path d="M1 3 a1 1 0 0 1 1-1 h2.6 l1.1 1.2 H10 a1 1 0 0 1 1 1 V9.5 a1 1 0 0 1-1 1 H2 a1 1 0 0 1-1-1 Z"/><path d="M4 8.5 V6.5 M6 8.5 V5.5 M8 8.5 V7" stroke-linecap="round"/></svg><span class="lbl">Projects</span></div>
  <div class="gap"></div>
  <div class="it"><svg class="ic" viewBox="0 0 12 12" fill="none" stroke="#A3A7AF" stroke-width="1.1" stroke-linejoin="round"><path d="M2 10 L3 6.8 L8.2 1.6 L10.4 3.8 L5.2 9 Z"/><path d="M7 2.8 L9.2 5"/></svg><span class="lbl">Design</span><svg class="chev" style="color:#8B8F98"><use href="#right"/></svg></div>
  <div class="it"><svg class="ic" viewBox="0 0 12 12" fill="none" stroke="#A3A7AF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6.5 H3 L4.6 2.5 L7.2 9.5 L8.8 6.5 H11"/></svg><span class="lbl">Simulate</span><svg class="chev" style="color:#8B8F98"><use href="#down"/></svg></div>
  <div class="it sub muted"><span class="lbl">Verification</span></div>
  <div class="it sub active"><span class="lbl">Simulations</span></div>
  <div class="it sub muted"><span class="lbl">Physics Analysis</span></div>
  <div class="it sub"><span class="lbl">Fault Tolerance Studio</span></div>
  <div class="it"><svg class="ic" viewBox="0 0 12 12" fill="none" stroke="#A3A7AF" stroke-width="1.1"><rect x="3" y="3" width="6" height="6" rx="1"/><path d="M4.5 1 V3 M7.5 1 V3 M4.5 9 V11 M7.5 9 V11 M1 4.5 H3 M1 7.5 H3 M9 4.5 H11 M9 7.5 H11"/></svg><span class="lbl">Compute</span><svg class="chev" style="color:#8B8F98"><use href="#down"/></svg></div>
  <div class="it sub muted"><span class="lbl">Quantum Composer</span></div>
  <div class="it sub muted"><span class="lbl">Quantum Lab</span></div>
  <div class="it"><svg class="ic" viewBox="0 0 12 12" fill="none" stroke="#A3A7AF" stroke-width="1.1"><ellipse cx="6" cy="2.6" rx="4.5" ry="1.6"/><path d="M1.5 2.6 V9.4 c0 .9 2 1.6 4.5 1.6 s4.5-.7 4.5-1.6 V2.6 M1.5 6 c0 .9 2 1.6 4.5 1.6 s4.5-.7 4.5-1.6"/></svg><span class="lbl">Manage</span><svg class="chev" style="color:#8B8F98"><use href="#down"/></svg></div>
  <div class="it sub"><span class="lbl">Work</span></div>
  <div class="it sub muted"><span class="lbl">Results</span></div>
  <div class="it sub"><span class="lbl">Version Control</span></div>
  <div class="it sub"><span class="lbl">Users &amp; Teams</span></div>
  <div class="it sub"><span class="lbl">Billing</span></div>
</nav>
<div class="it help"><svg class="ic" viewBox="0 0 12 12" fill="none" stroke="#A3A7AF" stroke-width="1.1"><circle cx="6" cy="6" r="4.8"/><circle cx="6" cy="6" r="2"/><path d="M2.6 2.6 L4.6 4.6 M9.4 2.6 L7.4 4.6 M2.6 9.4 L4.6 7.4 M9.4 9.4 L7.4 7.4"/></svg><span class="lbl">Help &amp; Support</span></div>
</body></html>
